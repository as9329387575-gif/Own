    <style>
      html, body, #root { height: 100%; }
      body { background-color: #f7f8fa; }
      html.dark body { background-color: #0e1014; }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-thumb { background: rgba(120,120,140,0.35); border-radius: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      .msg-prose { line-height: 1.65; }
      .msg-prose p { margin: 0.5rem 0; }
      .msg-prose ul, .msg-prose ol { margin: 0.5rem 0 0.5rem 1.25rem; }
      .msg-prose ul { list-style: disc; }
      .msg-prose ol { list-style: decimal; }

        margin: 0.5rem 0;

      }
      .msg-prose pre code { background: transparent; padding: 0; color: inherit; }
      .msg-prose h1, .msg-prose h2, .msg-prose h3 {
        margin: 0.75rem 0 0.4rem;

      .msg-prose h1 { font-size: 1.25rem; }
      .msg-prose h2 { font-size: 1.125rem; }
      .msg-prose h3 { font-size: 1rem; }

      html.dark .msg-prose blockquote { color: #aab; }

      .msg-prose th, .msg-prose td {

      @keyframes blink { to { visibility: hidden; } }

        overflow: hidden;

      #babel-error {
        display: none;

  <body>
    <div id="root">
      <div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#888;font-family:system-ui">
        Loading Private-AI…
      </div>
    </div>
    <pre id="babel-error"></pre>

    <script type="text/babel" data-presets="react,typescript" data-type="module">
      /* ============================================================
         PRIVATE-AI FRONTEND
         Single-file React app. Talks to FastAPI backend at /api/*.
         Conversation state lives in memory only — no localStorage.
         Closing the tab loses the session.
         ============================================================ */

      const { useState, useEffect, useRef, useMemo, useCallback } = React;

      // ---------- Config ----------
      // The API base URL. Empty string => same origin (recommended when
      // the backend serves this file). Override via ?api= if needed.
      const API_BASE = (() => {
        const q = new URLSearchParams(window.location.search);
        return q.get('api') || '';
      })();

      const DEFAULT_SETTINGS = {
        model: '',
        temperature: 0.7,
        max_tokens: 1024,
        system_prompt: 'You are a helpful assistant.',
        stream: true,
      };

      // ---------- Utilities ----------
      const cls = (...xs) => xs.filter(Boolean).join(' ');

      const uid = () =>
        (crypto.randomUUID && crypto.randomUUID()) ||
        ('id-' + Math.random().toString(36).slice(2) + Date.now().toString(36));

      // Markdown → sanitized HTML
      marked.setOptions({
        gfm: true,
        breaks: true,
      });

      function renderMarkdown(text) {
        try {
          const html = marked.parse(text || '');
          return DOMPurify.sanitize(html, {
            ADD_ATTR: ['target', 'rel'],
          });
        } catch {
          return DOMPurify.sanitize((text || '').replace(/</g, '&lt;'));
        }
      }

      // ---------- Theme ----------
      function useTheme() {
        const [theme, setTheme] = useState(() => {
          const saved = sessionStorage.getItem('pai.theme');
          if (saved === 'light' || saved === 'dark') return saved;
          return window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        });
        useEffect(() => {
          const root = document.documentElement;
          if (theme === 'dark') root.classList.add('dark');
          else root.classList.remove('dark');
          sessionStorage.setItem('pai.theme', theme);
        }, [theme]);
        return [theme, setTheme];
      }

      // ---------- API client ----------
      async function apiGet(path) {
        const res = await fetch(API_BASE + path, {
          method: 'GET',
          headers: { Accept: 'application/json' },
          credentials: 'omit',
          cache: 'no-store',
        });
        if (!res.ok) {
          let msg = `HTTP ${res.status}`;
          try {
            const j = await res.json();
            if (j && j.detail) msg = j.detail;
          } catch {}
          throw new Error(msg);
        }
        return res.json();
      }

      async function apiDelete(path) {
        const res = await fetch(API_BASE + path, {
          method: 'DELETE',
          credentials: 'omit',
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      }

      // Streaming chat. Calls onToken(delta), onDone(sessionId), onError(msg).
      // Returns an abort function.
      function streamChat({ body, onToken, onDone, onError }) {
        const ctrl = new AbortController();

        (async () => {
          try {
            const res = await fetch(API_BASE + '/api/chat', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Accept: 'text/event-stream',
              },
              body: JSON.stringify(body),
              credentials: 'omit',
              signal: ctrl.signal,
            });
            if (!res.ok) {
              let msg = `HTTP ${res.status}`;
              try {
                const j = await res.json();
                if (j && j.detail) msg = j.detail;
              } catch {}
              throw new Error(msg);
            }

            const reader = res.body.getReader();
            const dec = new TextDecoder();
            let buf = '';

            for (;;) {
              const { value, done } = await reader.read();
              if (done) break;
              buf += dec.decode(value, { stream: true });

              let idx;
              // SSE frames separated by \n\n
              while ((idx = buf.indexOf('\n\n')) !== -1) {
                const frame = buf.slice(0, idx);
                buf = buf.slice(idx + 2);
                const lines = frame.split('\n');
                for (const line of lines) {
                  if (!line.startsWith('data:')) continue;
                  const payload = line.slice(5).trim();
                  if (!payload) continue;
                  let evt;
                  try {
                    evt = JSON.parse(payload);
                  } catch {
                    continue;
                  }
                  if (evt.error) {
                    onError(evt.error);
                    return;
                  }
                  if (evt.token !== undefined) {
                    onToken(evt.token);
                  }
                  if (evt.done) {
                    onDone(evt.session_id || null);
                  }
                }
              }
            }
          } catch (e) {
            if (e.name === 'AbortError') return;
            onError(e.message || 'Network error');
          }
        })();

        return () => ctrl.abort();
      }

      // ---------- Small UI primitives ----------
      function IconButton({ label, onClick, children, className }) {
        return (
          <button
            type="button"
            aria-label={label}
            title={label}
            onClick={onClick}
            className={cls(
              'inline-flex items-center justify-center h-9 w-9 rounded-lg',
              'text-slate-600 hover:text-slate-900 hover:bg-slate-200/70',
              'dark:text-slate-300 dark:hover:text-white dark:hover:bg-slate-700/60',
              'transition-colors',
              className
            )}
          >
            {children}
          </button>
        );
      }

      function Icon({ name, size = 18 }) {
        const paths = {
          menu: 'M3 6h18M3 12h18M3 18h18',
          plus: 'M12 5v14M5 12h14',
          trash:
            'M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6',
          sun:
            'M12 4V2M12 22v-2M4 12H2M22 12h-2M5.6 5.6 4.2 4.2M19.8 19.8l-1.4-1.4M5.6 18.4 4.2 19.8M19.8 4.2l-1.4 1.4M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z',
          moon: 'M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z',
          send: 'M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z',
          stop: 'M6 6h12v12H6z',
          copy:
            'M9 9h10v12H9zM5 5h10v2M5 5v12h2M5 5H3v14a2 2 0 0 0 2 2h12',
          refresh:
            'M21 12a9 9 0 1 1-3-6.7M21 4v5h-5',
          settings:
            'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 8a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z',
          chat:
            'M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z',
          x: 'M18 6 6 18M6 6l12 12',
          check: 'M20 6 9 17l-5-5',
          shield:
            'M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z',
        };
        return (
          <svg
            width={size}
            height={size}
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            strokeWidth="2"
            strokeLinecap="round"
            strokeLinejoin="round"
            aria-hidden="true"
          >
            <path d={paths[name] || ''} />
          </svg>
        );
      }

      // ---------- Message rendering ----------
      const MessageBubble = React.memo(function MessageBubble({
        message,
        isStreaming,
        onCopy,
        onRegenerate,
      }) {
        const isUser = message.role === 'user';
        const [copied, setCopied] = useState(false);
        const htmlRef = useRef(null);

        useEffect(() => {
          if (!htmlRef.current) return;
          htmlRef.current.querySelectorAll('pre code').forEach((el) => {
            if (el.dataset.hl === '1') return;
            try {
              hljs.highlightElement(el);
            } catch {}
            el.dataset.hl = '1';
          });
        }, [message.content]);

        const handleCopy = async () => {
          try {
            await navigator.clipboard.writeText(message.content || '');
            setCopied(true);
            setTimeout(() => setCopied(false), 1500);
            onCopy && onCopy();
          } catch {}
        };

        const html = useMemo(
          () => (isUser ? null : renderMarkdown(message.content)),
          [message.content, isUser]
        );

        return (
          <div
            className={cls(
              'flex w-full gap-3 px-2 py-3',
              isUser ? 'justify-end' : 'justify-start'
            )}
          >
            {!isUser && (
              <div
                className={cls(
                  'shrink-0 h-8 w-8 rounded-full grid place-items-center text-white',
                  'bg-gradient-to-br from-brand-500 to-brand-700'
                )}
                aria-hidden="true"
              >
                <Icon name="shield" size={16} />
              </div>
            )}

            <div
              className={cls(
                'max-w-[min(760px,92%)] rounded-2xl px-4 py-3 text-[15px]',
                isUser
                  ? 'bg-brand-600 text-white rounded-br-md shadow-sm'
                  : 'bg-white dark:bg-slate-800 dark:text-slate-100 text-slate-900 border border-slate-200/70 dark:border-slate-700 rounded-bl-md shadow-sm'
              )}
            >
              {isUser ? (
                <div className="whitespace-pre-wrap break-words">{message.content}</div>
              ) : (
                <>
                  <div
                    ref={htmlRef}
                    className={cls('msg-prose break-words', isStreaming && 'cursor-blink')}
                    dangerouslySetInnerHTML={{ __html: html }}
                  />
                  {message.error && (
                    <div className="mt-2 text-sm text-red-600 dark:text-red-400">
                      ⚠ {message.error}
                    </div>
                  )}
                </>
              )}

              {!isUser && !isStreaming && message.content && !message.error && (
                <div className="mt-2 flex items-center gap-1 text-slate-500 dark:text-slate-400">
                  <button
                    type="button"
                    onClick={handleCopy}
                    className="inline-flex items-center gap-1 text-xs px-2 py-1 rounded hover:bg-slate-100 dark:hover:bg-slate-700"
                  >
                    <Icon name={copied ? 'check' : 'copy'} size={14} />
                    {copied ? 'Copied' : 'Copy'}
                  </button>
                  <button
                    type="button"
                    onClick={onRegenerate}
                    className="inline-flex items-center gap-1 text-xs px-2 py-1 rounded hover:bg-slate-100 dark:hover:bg-slate-700"
                  >
                    <Icon name="refresh" size={14} />
                    Regenerate
                  </button>
                </div>
              )}
            </div>

            {isUser && (
              <div
                className="shrink-0 h-8 w-8 rounded-full grid place-items-center bg-slate-300 text-slate-700 dark:bg-slate-600 dark:text-slate-100 text-xs font-semibold"
                aria-hidden="true"
              >
                You
              </div>
            )}
          </div>
        );
      });

      // ---------- Composer ----------
      function Composer({ onSend, onStop, busy, disabled }) {
        const [text, setText] = useState('');
        const taRef = useRef(null);

        const autosize = () => {
          const ta = taRef.current;
          if (!ta) return;
          ta.style.height = 'auto';
          ta.style.height = Math.min(ta.scrollHeight, 200) + 'px';
        };

        useEffect(autosize, [text]);

        const submit = () => {
          const v = text.trim();
          if (!v || busy || disabled) return;
          onSend(v);
          setText('');
          requestAnimationFrame(autosize);
        };

        const onKey = (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            submit();
          }
        };

        return (
          <div className="sticky bottom-0 px-2 pb-3 pt-2 bg-gradient-to-t from-slate-50 dark:from-slate-900 to-transparent">
            <div className="mx-auto max-w-3xl">
              <div className="flex items-end gap-2 rounded-2xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 shadow-sm p-2">
                <textarea
                  ref={taRef}
                  value={text}
                  onChange={(e) => setText(e.target.value)}
                  onKeyDown={onKey}
                  rows={1}
                  placeholder={
                    disabled
                      ? 'Backend unavailable…'
                      : 'Send a message… (Enter to send, Shift+Enter for newline)'
                  }
                  disabled={disabled}
                  className="flex-1 resize-none bg-transparent px-3 py-2 outline-none text-[15px] placeholder:text-slate-400 dark:placeholder:text-slate-500 dark:text-slate-100 disabled:opacity-50"
                />
                {busy ? (
                  <button
                    type="button"
                    onClick={onStop}
                    className="h-10 w-10 grid place-items-center rounded-xl bg-red-600 text-white hover:bg-red-700"
                    aria-label="Stop generation"
                    title="Stop"
                  >
                    <Icon name="stop" />
                  </button>
                ) : (
                  <button
                    type="button"
                    onClick={submit}
                    disabled={!text.trim() || disabled}
                    className={cls(
                      'h-10 w-10 grid place-items-center rounded-xl text-white transition-colors',
                      text.trim() && !disabled
                        ? 'bg-brand-600 hover:bg-brand-700'
                        : 'bg-slate-300 dark:bg-slate-700 cursor-not-allowed'
                    )}
                    aria-label="Send message"
                    title="Send"
                  >
                    <Icon name="send" />
                  </button>
                )}
              </div>
              <div className="mt-2 text-[11px] text-center text-slate-500 dark:text-slate-400">
                Conversations are ephemeral. Closing this tab discards them.
                No message content is logged by the server.
              </div>
            </div>
          </div>
        );
      }

      // ---------- Settings panel ----------
      function SettingsPanel({ open, onClose, settings, setSettings, models, backend }) {
        if (!open) return null;
        const update = (k, v) => setSettings((s) => ({ ...s, [k]: v }));

        return (
          <div
            className="fixed inset-0 z-40 bg-black/50 grid place-items-center p-4"
            onMouseDown={(e) => e.target === e.currentTarget && onClose()}
          >
            <div className="w-full max-w-lg rounded-2xl bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 shadow-xl">
              <div className="flex items-center justify-between border-b border-slate-200 dark:border-slate-700 px-5 py-3">
                <h2 className="font-semibold">Settings</h2>
                <IconButton label="Close" onClick={onClose}>
                  <Icon name="x" />
                </IconButton>
              </div>

              <div className="p-5 space-y-4 text-sm">
                <div className="text-xs text-slate-500 dark:text-slate-400">
                  Backend: <span className="font-mono">{backend || '…'}</span>
                </div>

                <div>
                  <label className="block mb-1 font-medium">Model</label>
                  <select
                    value={settings.model}
                    onChange={(e) => update('model', e.target.value)}
                    className="w-full rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 px-3 py-2"
                  >
                    <option value="">(backend default)</option>
                    {models.map((m) => (
                      <option key={m.id} value={m.id}>
                        {m.label || m.id}
                      </option>
                    ))}
                  </select>
                </div>

                <div>
                  <label className="block mb-1 font-medium">
                    Temperature: <span className="font-mono">{settings.temperature.toFixed(2)}</span>
                  </label>
                  <input
                    type="range"
                    min="0"
                    max="2"
                    step="0.05"
                    value={settings.temperature}
                    onChange={(e) => update('temperature', parseFloat(e.target.value))}
                    className="w-full"
                  />
                </div>

                <div>
                  <label className="block mb-1 font-medium">
                    Max output tokens: <span className="font-mono">{settings.max_tokens}</span>
                  </label>
                  <input
                    type="range"
                    min="64"
                    max="8192"
                    step="64"
                    value={settings.max_tokens}
                    onChange={(e) => update('max_tokens', parseInt(e.target.value, 10))}
                    className="w-full"
                  />
                </div>

                <div>
                  <label className="block mb-1 font-medium">System prompt</label>
                  <textarea
                    rows={3}
                    value={settings.system_prompt}
                    onChange={(e) => update('system_prompt', e.target.value)}
                    className="w-full rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 px-3 py-2 font-mono text-xs"
                  />
                </div>

                <label className="flex items-center gap-2">
                  <input
                    type="checkbox"
                    checked={settings.stream}
                    onChange={(e) => update('stream', e.target.checked)}
                  />
                  <span>Stream responses</span>
                </label>
              </div>

              <div className="border-t border-slate-200 dark:border-slate-700 px-5 py-3 flex justify-end">
                <button
                  type="button"
                  onClick={onClose}
                  className="rounded-lg bg-brand-600 px-4 py-2 text-white hover:bg-brand-700"
                >
                  Done
                </button>
              </div>
            </div>
          </div>
        );
      }

      // ---------- Sidebar ----------
      function Sidebar({
        open,
        onClose,
        conversations,
        activeId,
        onNewChat,
        onSelect,
        onDelete,
        onOpenSettings,
        theme,
        setTheme,
      }) {
        return (
          <>
            {/* Mobile backdrop */}
            <div
              className={cls(
                'fixed inset-0 z-30 bg-black/40 md:hidden transition-opacity',
                open ? 'opacity-100' : 'opacity-0 pointer-events-none'
              )}
              onClick={onClose}
            />
            <aside
              className={cls(
                'fixed md:static z-30 top-0 left-0 h-full w-72 shrink-0',
                'bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800',
                'flex flex-col transition-transform duration-200',
                open ? 'translate-x-0' : '-translate-x-full md:translate-x-0'
              )}
            >
              <div className="p-3 flex items-center gap-2 border-b border-slate-200 dark:border-slate-800">
                <div className="h-8 w-8 rounded-lg grid place-items-center text-white bg-gradient-to-br from-brand-500 to-brand-700">
                  <Icon name="shield" size={16} />
                </div>
                <div className="flex-1 min-w-0">
                  <div className="font-semibold leading-tight">Private-AI</div>
                  <div className="text-[11px] text-slate-500 dark:text-slate-400 leading-tight">
                    Ephemeral chat
                  </div>
                </div>
                <IconButton label="Close sidebar" className="md:hidden" onClick={onClose}>
                  <Icon name="x" />
                </IconButton>
              </div>

              <div className="p-3">
                <button
                  type="button"
                  onClick={onNewChat}
                  className="w-full inline-flex items-center justify-center gap-2 rounded-lg bg-brand-600 hover:bg-brand-700 text-white px-3 py-2 font-medium"
                >
                  <Icon name="plus" size={16} />
                  New chat
                </button>
              </div>

              <div className="flex-1 overflow-y-auto px-2">
                {conversations.length === 0 && (
                  <div className="text-xs text-slate-500 dark:text-slate-400 px-3 py-6 text-center">
                    No conversations yet.
                  </div>
                )}
                <ul className="space-y-1">
                  {conversations.map((c) => (
                    <li key={c.id}>
                      <div
                        className={cls(
                          'group flex items-center gap-2 rounded-lg px-2 py-2 cursor-pointer',
                          c.id === activeId
                            ? 'bg-brand-50 dark:bg-slate-800'
                            : 'hover:bg-slate-100 dark:hover:bg-slate-800/60'
                        )}
                        onClick={() => onSelect(c.id)}
                      >
                        <Icon name="chat" size={16} />
                        <div className="flex-1 min-w-0">
                          <div className="line-clamp-1 text-sm">{c.title || 'New chat'}</div>
                          <div className="text-[11px] text-slate-500 dark:text-slate-400">
                            {c.messages.length} msg{c.messages.length === 1 ? '' : 's'}
                          </div>
                        </div>
                        <button
                          type="button"
                          aria-label="Delete conversation"
                          title="Delete"
                          className="opacity-0 group-hover:opacity-100 transition-opacity h-7 w-7 grid place-items-center rounded text-slate-500 hover:text-red-600 hover:bg-red-50 dark:hover:bg-red-900/30"
                          onClick={(e) => {
                            e.stopPropagation();
                            onDelete(c.id);
                          }}
                        >
                          <Icon name="trash" size={14} />
                        </button>
                      </div>
                    </li>
                  ))}
                </ul>
              </div>

              <div className="p-3 border-t border-slate-200 dark:border-slate-800 flex items-center gap-2">
                <button
                  type="button"
                  onClick={onOpenSettings}
                  className="flex-1 inline-flex items-center justify-center gap-2 rounded-lg border border-slate-200 dark:border-slate-700 px-2 py-2 text-sm hover:bg-slate-100 dark:hover:bg-slate-800"
                >
                  <Icon name="settings" size={16} />
                  Settings
                </button>
                <IconButton
                  label={theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'}
                  onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')}
                >
                  <Icon name={theme === 'dark' ? 'sun' : 'moon'} size={16} />
                </IconButton>
              </div>
            </aside>
          </>
        );
      }

      // ---------- App ----------
      function App() {
        const [theme, setTheme] = useTheme();
        const [sidebarOpen, setSidebarOpen] = useState(false);

        const [conversations, setConversations] = useState([]);
        const [activeId, setActiveId] = useState(null);
        const [sessionId, setSessionId] = useState(null);

        const [settings, setSettings] = useState(DEFAULT_SETTINGS);
        const [models, setModels] = useState([]);
        const [backend, setBackend] = useState('');
        const [settingsOpen, setSettingsOpen] = useState(false);

        const [busy, setBusy] = useState(false);
        const [backendOk, setBackendOk] = useState(null); // null unknown | true | false
        const abortRef = useRef(null);

        const activeConv = useMemo(
          () => conversations.find((c) => c.id === activeId) || null,
          [conversations, activeId]
        );

        // ----- Backend discovery -----
        useEffect(() => {
          let alive = true;
          (async () => {
            try {
              const h = await apiGet('/api/health');
              if (!alive) return;
              setBackendOk(true);
              setBackend(h.backend || '');
              try {
                const ms = await apiGet('/api/models');
                if (!alive) return;
                setModels(ms.models || []);
              } catch {
                setModels([]);
              }
            } catch {
              if (alive) setBackendOk(false);
            }
          })();
          return () => {
            alive = false;
          };
        }, []);

        // ----- New chat -----
        const newChat = useCallback(() => {
          if (abortRef.current) {
            abortRef.current();
            abortRef.current = null;
          }
          setBusy(false);
          const id = uid();
          const conv = {
            id,
            title: '',
            messages: [],
            createdAt: Date.now(),
          };
          setConversations((cs) => [conv, ...cs]);
          setActiveId(id);
          setSessionId(null);
          setSidebarOpen(false);
        }, []);

        // ----- Select / delete -----
        const selectConv = (id) => {
          if (busy) return;
          setActiveId(id);
          setSessionId(null); // server session not recoverable after reload
          setSidebarOpen(false);
        };

        const deleteConv = async (id) => {
          setConversations((cs) => cs.filter((c) => c.id !== id));
          if (activeId === id) {
            setActiveId(null);
            setSessionId(null);
          }
          if (sessionId) {
            try {
              await apiDelete(`/api/session/${encodeURIComponent(sessionId)}`);
            } catch {}
          }
        };

        // ----- Delete current session (server-side) -----
        const deleteCurrentSession = async () => {
          if (sessionId) {
            try {
              await apiDelete(`/api/session/${encodeURIComponent(sessionId)}`);
            } catch {}
          }
          setSessionId(null);
          if (activeId) {
            setConversations((cs) =>
              cs.map((c) =>
                c.id === activeId
                  ? { ...c, messages: [], title: '' }
                  : c
              )
            );
          }
        };

        // ----- Send -----
        const sendMessage = (text) => {
          if (!activeConv) {
            // If no conversation exists, create one then send.
            const id = uid();
            const conv = { id, title: '', messages: [], createdAt: Date.now() };
            setConversations((cs) => [conv, ...cs]);
            setActiveId(id);
            // queue send on next tick
            setTimeout(() => sendTo(id, text), 0);
            return;
          }
          sendTo(activeConv.id, text);
        };

        const sendTo = (convId, text) => {
          setConversations((cs) =>
            cs.map((c) => {
              if (c.id !== convId) return c;
              const userMsg = { id: uid(), role: 'user', content: text };
              const assistantMsg = {
                id: uid(),
                role: 'assistant',
                content: '',
                streaming: settings.stream,
              };
              const title =
                c.title ||
                (text.length > 48 ? text.slice(0, 48).trim() + '…' : text);
              return {
                ...c,
                title,
                messages: [...c.messages, userMsg, assistantMsg],
              };
            })
          );

          // Build request payload from current conversation snapshot.
          const conv = conversations.find((c) => c.id === convId);
          const prior = conv ? conv.messages.filter((m) => !m.error) : [];
          const history = [
            ...prior.map((m) => ({ role: m.role, content: m.content })),
            { role: 'user', content: text },
          ];

          const body = {
            session_id: sessionId || null,
            messages: history,
            settings: {
              model: settings.model || '',
              temperature: settings.temperature,
              max_tokens: settings.max_tokens,
              system_prompt: settings.system_prompt,
              stream: settings.stream,
            },
          };

          setBusy(true);

          if (settings.stream) {
            abortRef.current = streamChat({
              body,
              onToken: (tok) => {
                setConversations((cs) =>
                  cs.map((c) => {
                    if (c.id !== convId) return c;
                    const msgs = c.messages.slice();
                    const last = msgs[msgs.length - 1];
                    if (last && last.role === 'assistant') {
                      msgs[msgs.length - 1] = {
                        ...last,
                        content: last.content + tok,
                      };
                    }
                    return { ...c, messages: msgs };
                  })
                );
              },
              onDone: (sid) => {
                if (sid) setSessionId(sid);
                setBusy(false);
                abortRef.current = null;
                setConversations((cs) =>
                  cs.map((c) => {
                    if (c.id !== convId) return c;
                    const msgs = c.messages.slice();
                    const last = msgs[msgs.length - 1];
                    if (last && last.role === 'assistant') {
                      msgs[msgs.length - 1] = { ...last, streaming: false };
                    }
                    return { ...c, messages: msgs };
                  })
                );
              },
              onError: (msg) => {
                setBusy(false);
                abortRef.current = null;
                setConversations((cs) =>
                  cs.map((c) => {
                    if (c.id !== convId) return c;
                    const msgs = c.messages.slice();
                    const last = msgs[msgs.length - 1];
                    if (last && last.role === 'assistant') {
                      msgs[msgs.length - 1] = {
                        ...last,
                        streaming: false,
                        error: msg,
                      };
                    }
                    return { ...c, messages: msgs };
                  })
                );
              },
            });
          } else {
            // Non-streaming
            (async () => {
              try {
                const res = await fetch(API_BASE + '/api/chat', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(body),
                  credentials: 'omit',
                });
                if (!res.ok) {
                  let m = `HTTP ${res.status}`;
                  try {
                    const j = await res.json();
                    if (j && j.detail) m = j.detail;
                  } catch {}
                  throw new Error(m);
                }
                const data = await res.json();
                if (data.session_id) setSessionId(data.session_id);
                setConversations((cs) =>
                  cs.map((c) => {
                    if (c.id !== convId) return c;
                    const msgs = c.messages.slice();
                    const last = msgs[msgs.length - 1];
                    if (last && last.role === 'assistant') {
                      msgs[msgs.length - 1] = {
                        ...last,
                        content: data.message?.content || '',
                        streaming: false,
                      };
                    }
                    return { ...c, messages: msgs };
                  })
                );
              } catch (e) {
                setConversations((cs) =>
                  cs.map((c) => {
                    if (c.id !== convId) return c;
                    const msgs = c.messages.slice();
                    const last = msgs[msgs.length - 1];
                    if (last && last.role === 'assistant') {
                      msgs[msgs.length - 1] = {
                        ...last,
                        streaming: false,
                        error: e.message || 'Error',
                      };
                    }
                    return { ...c, messages: msgs };
                  })
                );
              } finally {
                setBusy(false);
              }
            })();
          }
        };

        const stopGeneration = () => {
          if (abortRef.current) {
            abortRef.current();
            abortRef.current = null;
          }
          setBusy(false);
          setConversations((cs) =>
            cs.map((c) => {
              if (c.id !== activeConv?.id) return c;
              const msgs = c.messages.slice();
              const last = msgs[msgs.length - 1];
              if (last && last.role === 'assistant') {
                msgs[msgs.length - 1] = { ...last, streaming: false };
              }
              return { ...c, messages: msgs };
            })
          );
        };

        const regenerate = () => {
          if (!activeConv || busy) return;
          // Remove last assistant msg and re-send the last user msg.
          const msgs = activeConv.messages;
          let lastUserIdx = -1;
          for (let i = msgs.length - 1; i >= 0; i--) {
            if (msgs[i].role === 'user') {
              lastUserIdx = i;
              break;
            }
          }
          if (lastUserIdx === -1) return;
          const lastUser = msgs[lastUserIdx];
          const trimmed = msgs.slice(0, lastUserIdx + 1);
          setConversations((cs) =>
            cs.map((c) =>
              c.id === activeConv.id ? { ...c, messages: trimmed } : c
            )
          );
          setTimeout(() => sendTo(activeConv.id, lastUser.content), 0);
        };

        const messages = activeConv?.messages || [];

        return (
          <div className="h-full flex bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100">
            <Sidebar
              open={sidebarOpen}
              onClose={() => setSidebarOpen(false)}
              conversations={conversations}
              activeId={activeId}
              onNewChat={newChat}
              onSelect={selectConv}
              onDelete={deleteConv}
              onOpenSettings={() => setSettingsOpen(true)}
              theme={theme}
              setTheme={setTheme}
            />

            <main className="flex-1 min-w-0 flex flex-col">
              {/* Top bar */}
              <header className="flex items-center gap-2 px-3 py-2 border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur">
                <IconButton
                  label="Open sidebar"
                  className="md:hidden"
                  onClick={() => setSidebarOpen(true)}
                >
                  <Icon name="menu" />
                </IconButton>

                <div className="flex-1 min-w-0">
                  <div className="text-sm font-medium line-clamp-1">
                    {activeConv?.title || 'New chat'}
                  </div>
                  <div className="text-[11px] text-slate-500 dark:text-slate-400">
                    {backendOk === false
                      ? 'Backend unreachable'
                      : backendOk === true
                      ? `Connected · ${backend || 'model backend'}`
                      : 'Connecting…'}
                  </div>
                </div>

                <button
                  type="button"
                  onClick={deleteCurrentSession}
                  className="hidden sm:inline-flex items-center gap-1 text-xs rounded-lg border border-slate-200 dark:border-slate-700 px-2 py-1.5 hover:bg-red-50 hover:text-red-600 dark:hover:bg-red-900/30"
                  title="Delete this session's data on the server"
                >
                  <Icon name="trash" size={14} />
                  Delete session
                </button>

                <IconButton label="Settings" onClick={() => setSettingsOpen(true)}>
                  <Icon name="settings" size={16} />
                </IconButton>
              </header>

              {/* Messages */}
              <div className="flex-1 overflow-y-auto">
                <div className="mx-auto max-w-3xl px-1 sm:px-4 py-4">
                  {messages.length === 0 && (
                    <EmptyState
                      onPrompt={(p) => {
                        if (!activeConv) newChat();
                        setTimeout(() => {
                          sendMessage(p);
                        }, 0);
                      }}
                      backendOk={backendOk}
                    />
                  )}
                  {messages.map((m, i) => (
                    <MessageBubble
                      key={m.id || i}
                      message={m}
                      isStreaming={!!m.streaming && busy}
                      onCopy={() => {}}
                      onRegenerate={
                        m.role === 'assistant' ? regenerate : undefined
                      }
                    />
                  ))}
                  <div className="h-4" />
                </div>
              </div>

              {/* Composer */}
              <Composer
                onSend={sendMessage}
                onStop={stopGeneration}
                busy={busy}
                disabled={backendOk === false}
              />

              <SettingsPanel
                open={settingsOpen}
                onClose={() => setSettingsOpen(false)}
                settings={settings}
                setSettings={setSettings}
                models={models}
                backend={backend}
              />
            </main>
          </div>
        );
      }

      // ---------- Empty state ----------
      function EmptyState({ onPrompt, backendOk }) {
        const suggestions = [
          'Explain how SSE streaming works in two sentences.',
          'Write a Python function that reverses a linked list.',
          'Draft a concise README section for a privacy-first tool.',
          'Compare SQLite and Postgres in a small table.',
        ];

        return (
          <div className="py-10 sm:py-16 text-center">
            <div className="mx-auto h-14 w-14 rounded-2xl grid place-items-center text-white bg-gradient-to-br from-brand-500 to-brand-700 shadow-lg">
              <Icon name="shield" size={26} />
            </div>
            <h1 className="mt-4 text-2xl sm:text-3xl font-semibold">
              Private-AI
            </h1>
            <p className="mt-2 text-slate-600 dark:text-slate-400 max-w-lg mx-auto px-4">
              A self-hostable, privacy-first assistant. Conversations live only in
              memory and are discarded when your session ends.
            </p>

            {backendOk === false && (
              <div className="mt-4 inline-block rounded-lg bg-red-50 text-red-700 dark:bg-red-900/30 dark:text-red-300 px-3 py-2 text-sm">
                Backend unreachable. Check that the FastAPI server is running and
                CORS is configured for this origin.
              </div>
            )}

            <div className="mt-8 grid sm:grid-cols-2 gap-2 max-w-xl mx-auto px-4">
              {suggestions.map((s) => (
                <button
                  key={s}
                  type="button"
                  disabled={backendOk === false}
                  onClick={() => onPrompt(s)}
                  className="text-left rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-3 hover:border-brand-400 hover:bg-brand-50/40 dark:hover:bg-slate-700/60 transition-colors text-sm disabled:opacity-50"
                >
                  {s}
                </button>
              ))}
            </div>

            <p className="mt-8 text-[11px] text-slate-500 dark:text-slate-400 max-w-lg mx-auto px-4">
              If your admin has configured an external model provider, your
              messages will be processed by that provider. Use a local model
              (Ollama) for maximum privacy.
            </p>
          </div>
        );
      }

      // ---------- Mount ----------
      try {
        ReactDOM.createRoot(document.getElementById('root')).render(
          <App />
        );
      } catch (e) {
        const pre = document.getElementById('babel-error');
        pre.style.display = 'block';
        pre.textContent = 'Render error: ' + (e && e.message ? e.message : e);
      }
    </script>

    <noscript>
      <div style="padding:2rem;font-family:system-ui">
        Private-AI requires JavaScript.
      </div>
    </noscript>
  </body>
</html>
